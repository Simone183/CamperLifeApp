
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#34412B"/>
      <stop offset="100%" stop-color="#232C1D"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#D97706"/>
    </linearGradient>
    <linearGradient id="vanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Background rounded canvas -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)"/>
  
  <!-- Subtle Mountains in background -->
  <path d="M60 360 L180 210 L280 340 L370 230 L460 360 Z" fill="#4B5841" opacity="0.45"/>
  <path d="M140 360 L240 240 L340 360 Z" fill="#5A6B4E" opacity="0.4"/>
  
  <!-- Sun / Horizon circle -->
  <circle cx="370" cy="180" r="46" fill="url(#goldGrad)" opacity="0.9"/>
  
  <!-- Road arc -->
  <path d="M 40 430 Q 256 410 472 430 L 480 470 Q 256 460 32 470 Z" fill="#1C2417"/>
  <path d="M 120 448 L 170 447 M 230 446 L 282 446 M 342 447 L 392 448" stroke="#FBBF24" stroke-width="5" stroke-linecap="round" opacity="0.7"/>

  <!-- Camper Van Body -->
  <g filter="url(#shadow)">
    <!-- Main Body -->
    <path d="M 120 280 L 120 370 Q 120 380 130 380 L 150 380 Q 160 380 165 375 A 35 35 0 0 1 235 375 Q 240 380 250 380 L 325 380 Q 330 380 335 375 A 35 35 0 0 1 405 375 Q 410 380 420 380 L 430 380 Q 440 380 440 370 L 440 330 Q 440 310 415 295 L 375 270 Q 365 265 350 265 L 135 265 Q 120 265 120 280 Z" fill="url(#vanGrad)"/>
    
    <!-- Van Roof Rack & Pop-top -->
    <path d="M 140 252 L 330 252 Q 335 252 335 258 L 335 265 L 135 265 L 135 258 Q 135 252 140 252 Z" fill="#CBD5E1"/>
    
    <!-- Accent Stripe -->
    <path d="M 120 325 L 435 325 L 430 340 L 120 340 Z" fill="url(#goldGrad)"/>
    
    <!-- Front windshield -->
    <path d="M 355 275 L 395 298 Q 405 305 405 315 L 350 315 L 350 275 Z" fill="#334155"/>
    
    <!-- Side windows -->
    <rect x="250" y="275" width="85" height="40" rx="6" fill="#334155"/>
    <rect x="145" y="275" width="85" height="40" rx="6" fill="#334155"/>
    
    <!-- Van Headlight -->
    <rect x="428" y="328" width="12" height="18" rx="4" fill="#FEF08A"/>
    <!-- Van Taillight -->
    <rect x="120" y="328" width="8" height="20" rx="3" fill="#EF4444"/>
    
    <!-- Wheels -->
    <g>
      <!-- Rear Wheel -->
      <circle cx="200" cy="375" r="28" fill="#1E293B"/>
      <circle cx="200" cy="375" r="14" fill="#94A3B8"/>
      <circle cx="200" cy="375" r="6" fill="#475569"/>
      
      <!-- Front Wheel -->
      <circle cx="370" cy="375" r="28" fill="#1E293B"/>
      <circle cx="370" cy="375" r="14" fill="#94A3B8"/>
      <circle cx="370" cy="375" r="6" fill="#475569"/>
    </g>
  </g>

  <!-- Compass Star in Upper Left -->
  <g transform="translate(100, 150) scale(0.65)" opacity="0.85">
    <polygon points="0,-40 8,-10 38,0 8,10 0,40 -8,10 -38,0 -8,-10" fill="#FBBF24"/>
    <polygon points="0,-40 8,-10 0,0" fill="#D97706"/>
    <polygon points="38,0 8,10 0,0" fill="#D97706"/>
    <polygon points="0,40 -8,10 0,0" fill="#D97706"/>
    <polygon points="-38,0 -8,-10 0,0" fill="#D97706"/>
    <circle cx="0" cy="0" r="4" fill="#FFFFFF"/>
  </g>
</svg>
