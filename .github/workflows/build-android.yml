name: Build Android App (APK & AAB)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Android SDK 36 & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0"

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Regenerate Valid Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Setup Release Keystore from Secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          node -e '
            const fs = require("fs");
            const raw = process.env.KEYSTORE_B64 || "";
            if (!raw.trim()) {
              console.log("⚠️ Secret RELEASE_KEYSTORE_BASE64 non presente. Firma di release in fallback.");
              process.exit(0);
            }
            try {
              // Rimuovi spazi, a capi e virgolette accidentali
              const cleaned = raw.trim().replace(/^["'\s]+|["'\s]+$/g, "").replace(/[^A-Za-z0-9+/=]/g, "");
              const buf = Buffer.from(cleaned, "base64");
              if (buf.length < 100) {
                console.log("⚠️ Il secret RELEASE_KEYSTORE_BASE64 è troppo corto o non valido. Fallback debug.");
                process.exit(0);
              }
              fs.writeFileSync("android/app/release.keystore", buf);
              console.log("✅ Keystore decodificato con successo (" + buf.length + " bytes)");
            } catch (err) {
              console.log("⚠️ Errore decodifica Keystore Base64:", err.message);
            }
          '
          if [ -f "android/app/release.keystore" ]; then
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASS}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${ALIAS}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASS}" >> $GITHUB_ENV
            echo "✅ Configurazione Keystore Completata."
          else
            echo "⚠️ Utilizzo signing config debug per la build di fallback."
          fi

      - name: Build Android App
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Upload Android App Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViaCamperApp-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ViaCamperApp-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Debug APK Artifact (For testing on phone)
        uses: actions/upload-artifact@v4
        with:
          name: ViaCamperApp-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn


