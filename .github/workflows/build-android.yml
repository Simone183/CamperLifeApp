name: Build Android App (APK & AAB)

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Setup Java JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Install Android SDK 36 & Build Tools
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "platforms;android-35" "build-tools;36.0.0" "build-tools;35.0.0"

      - name: Install Dependencies
        run: npm install

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          validate-wrappers: false

      - name: Regenerate Valid Gradle Wrapper
        run: |
          cd android
          gradle wrapper --gradle-version 8.11.1 --distribution-type bin

      - name: Setup Release Keystore from Secrets
        env:
          KEYSTORE_B64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.RELEASE_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          node .github/scripts/decode-keystore.cjs
          if [ -f "android/app/release.keystore" ]; then
            echo "KEYSTORE_FILE=release.keystore" >> $GITHUB_ENV
            echo "KEYSTORE_PASSWORD=${KEYSTORE_PASS}" >> $GITHUB_ENV
            echo "KEY_ALIAS=${ALIAS}" >> $GITHUB_ENV
            echo "KEY_PASSWORD=${KEY_PASS}" >> $GITHUB_ENV
            echo "✅ Configurazione Keystore Completata."
          else
            echo "⚠️ Utilizzo signing config debug per la build di fallback."
          fi

      - name: Build Android App
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace --no-daemon

      - name: Create GitHub Release with App Files (No Artifact Quota Limit)
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        with:
          tag_name: build-latest
          name: "ViaCamper App Latest Build"
          body: "Ultima versione compilata di ViaCamper (AAB per Play Store e APK per installazione diretta)."
          draft: false
          prerelease: false
          files: |
            android/app/build/outputs/bundle/release/*.aab
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Android App Bundle (.aab) Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ViaCamperApp-Release-AAB
          path: android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ViaCamperApp-Release-APK
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 1

      - name: Upload Debug APK Artifact (For testing on phone)
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: ViaCamperApp-Debug-APK
          path: android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 1


