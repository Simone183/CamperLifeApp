name: Build Android Bundle (AAB) & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
          cache: 'gradle'

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        env:
          CI: true
        run: |
          if [ ! -d "android" ]; then
            echo "Android directory not found. Initializing Android platform..."
            npx --yes @capacitor/cli add android
          fi
          npx --yes @capacitor/cli sync android

      - name: Generate & Verify Clean Android Assets
        run: node generate-assets.js

      - name: Grant Execute Permission for Gradlew
        run: |
          if [ -f "android/gradlew" ]; then
            chmod +x android/gradlew
          fi
          # Ensure gradle-wrapper.jar is valid binary, fetch if corrupted or missing
          if [ ! -f "android/gradle/wrapper/gradle-wrapper.jar" ] || ! unzip -tq android/gradle/wrapper/gradle-wrapper.jar 2>/dev/null; then
            echo "Repairing gradle-wrapper.jar..."
            mkdir -p android/gradle/wrapper
            curl -sL https://raw.githubusercontent.com/gradle/gradle/v8.14.3/gradle/wrapper/gradle-wrapper.jar -o android/gradle/wrapper/gradle-wrapper.jar
          fi

      - name: Build Android Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Locate AAB file
        id: find_aab
        run: |
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            echo "❌ File .aab non trovato!"
            exit 1
          fi
          echo "Found AAB at: $AAB_PATH"
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT
          
          # Estrai versione dal package.json
          VERSION=$(node -p "require('./package.json').version")
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Prepare Named AAB Release File
        id: prep_release
        run: |
          AAB_ORIGIN="${{ steps.find_aab.outputs.aab_path }}"
          VERSION="${{ steps.find_aab.outputs.app_version }}"
          NAMED_AAB="android/app/build/outputs/bundle/release/ViaCamper-v${VERSION}.aab"
          cp "$AAB_ORIGIN" "$NAMED_AAB"
          echo "named_aab=$NAMED_AAB" >> $GITHUB_OUTPUT

      - name: Upload AAB to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: viacamper-v${{ steps.find_aab.outputs.app_version }}-bundle
          path: ${{ steps.prep_release.outputs.named_aab }}
          retention-days: 1

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: steps.find_aab.outcome == 'success'
        with:
          tag_name: v${{ steps.find_aab.outputs.app_version }}
          name: ViaCamper v${{ steps.find_aab.outputs.app_version }}
          body: |
            🚀 **Release ViaCamper v${{ steps.find_aab.outputs.app_version }}**
            
            - File Android Bundle (`ViaCamper-v${{ steps.find_aab.outputs.app_version }}.aab`) pronto per il caricamento su Google Play Console.
            - Compilazione automatica completata con successo da GitHub Actions.
          files: ${{ steps.prep_release.outputs.named_aab }}
          draft: false
          prerelease: false
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
