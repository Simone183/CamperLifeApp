name: Build Android Bundle (AAB) & Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Release AAB
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install NPM Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Grant Execute Permission for Gradlew
        run: chmod +x android/gradlew

      - name: Build Android Bundle (AAB)
        run: |
          cd android
          ./gradlew bundleRelease --stacktrace

      - name: Locate AAB file
        id: find_aab
        run: |
          AAB_PATH=$(find android/app/build/outputs/bundle/release -name "*.aab" | head -n 1)
          if [ -z "$AAB_PATH" ]; then
            echo "❌ File .aab non trovato!"
            exit 1
          fi
          echo "Found AAB at: $AAB_PATH"
          echo "aab_path=$AAB_PATH" >> $GITHUB_OUTPUT
          
          # Estrai versione dal package.json
          VERSION=$(node -p "require('./package.json').version")
          echo "app_version=$VERSION" >> $GITHUB_OUTPUT

      - name: Upload AAB to GitHub Actions Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: viacamper-v${{ steps.find_aab.outputs.app_version }}-bundle
          path: ${{ steps.find_aab.outputs.aab_path }}
          retention-days: 14

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/heads/')
        with:
          tag_name: v${{ steps.find_aab.outputs.app_version }}
          name: ViaCamper v${{ steps.find_aab.outputs.app_version }}
          body: |
            🚀 **Nuova Versione ViaCamper v${{ steps.find_aab.outputs.app_version }}**
            
            - Android Bundle (`.aab`) pronto per il caricamento su Google Play Console.
            - Compilazione automatica completata con successo da GitHub Actions.
          files: ${{ steps.find_aab.outputs.aab_path }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
