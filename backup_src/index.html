<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>CamperLife</title>
    <link rel="manifest" href="/manifest.json" />
    <link rel="apple-touch-icon" href="/logo.svg" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />
    <meta name="theme-color" content="#3E4A35" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <script>
      // Automatically attempt to map the tab favicon to the custom uploaded logo files
      const candidates = ['/logo.png', '/logo.svg', '/logo.jpg'];
      let index = 0;
      function checkFavicon() {
        if (index >= candidates.length) return;
        const img = new Image();
        img.onload = function() {
          const favicon = document.querySelector('link[rel="icon"]');
          if (favicon) {
            favicon.href = candidates[index];
            favicon.type = candidates[index].endsWith('.svg') ? 'image/svg+xml' : 'image/png';
          }
        };
        img.onerror = function() {
          index++;
          checkFavicon();
        };
        img.src = candidates[index];
      }
      checkFavicon();

      // Force clearing of any old, broken service worker caches specifically on mobile to fix image displays
      if (localStorage.getItem('clear_cache_v2026_sharp_v31') !== 'true') {
        if ('caches' in window) {
          caches.keys().then((names) => {
            Promise.all(names.map(name => caches.delete(name))).then(() => {
              // Unregister previous service workers to start fresh
              if ('serviceWorker' in navigator) {
                navigator.serviceWorker.getRegistrations().then((registrations) => {
                  Promise.all(registrations.map(r => r.unregister())).then(() => {
                    localStorage.setItem('clear_cache_v2026_sharp_v31', 'true');
                    console.log('Stale mobile caches & registrations cleared. Reloading...');
                    window.location.reload();
                  });
                }).catch(() => {
                  localStorage.setItem('clear_cache_v2026_sharp_v31', 'true');
                  window.location.reload();
                });
              } else {
                localStorage.setItem('clear_cache_v2026_sharp_v31', 'true');
                window.location.reload();
              }
            });
          }).catch(() => {
            localStorage.setItem('clear_cache_v2026_sharp_v31', 'true');
          });
        } else {
          localStorage.setItem('clear_cache_v2026_sharp_v31', 'true');
        }
      }

      // Register the service worker for Android installability PWA support immediately
      if ('serviceWorker' in navigator) {
        navigator.serviceWorker.register('/sw.js?v=2026_v31')
          .then((registration) => {
            console.log('ServiceWorker registered with scope:', registration.scope);
            // Force code synchronization checking
            if (registration.update) {
              registration.update();
            }
          })
          .catch((error) => {
            console.warn('ServiceWorker registration failed:', error);
          });
      }
    </script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
