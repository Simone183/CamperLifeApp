<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ViaCamper</title>
    <meta name="description" content="Mappe per aree sosta e campeggi, navigazione basata su dimensioni, checklist per la sicurezza, scadenze e messaggistica community per camperisti." />
    <meta property="og:title" content="ViaCamper" />
    <meta property="og:description" content="Mappe per aree sosta e campeggi, navigazione basata su dimensioni, checklist per la sicurezza, scadenze e messaggistica community per camperisti." />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/logo-192x192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <meta name="theme-color" content="#1C261B" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <script>
      // 1. Resilient Storage Shim for sandboxed iframes & restricted mobile browsers
      (function() {
        var isStorageWorking = false;
        try {
          if (typeof window !== 'undefined' && 'localStorage' in window && window.localStorage !== null) {
            var testKey = '__vc_test__';
            window.localStorage.setItem(testKey, '1');
            window.localStorage.removeItem(testKey);
            isStorageWorking = true;
          }
        } catch (e) {
          isStorageWorking = false;
        }

        if (!isStorageWorking) {
          console.warn('[ViaCamper] Storage is restricted. Polyfilling in-memory storage.');
          var memStore = {};
          var safeShim = {
            getItem: function(k) { return Object.prototype.hasOwnProperty.call(memStore, k) ? memStore[k] : null; },
            setItem: function(k, v) { memStore[k] = String(v); },
            removeItem: function(k) { delete memStore[k]; },
            clear: function() { memStore = {}; },
            key: function(i) { return Object.keys(memStore)[i] || null; },
            get length() { return Object.keys(memStore).length; }
          };
          try {
            Object.defineProperty(window, 'localStorage', { value: safeShim, configurable: true, writable: true });
            Object.defineProperty(window, 'sessionStorage', { value: safeShim, configurable: true, writable: true });
          } catch (shimErr) {
            try { window.localStorage = safeShim; window.sessionStorage = safeShim; } catch (e2) {}
          }
        }
      })();

      // 2. Service Worker registration (only in top-level standalone context)
      try {
        if ('serviceWorker' in navigator && window.self === window.top) {
          window.addEventListener('load', function() {
            navigator.serviceWorker.register('/sw.js').catch(function(err) {
              console.warn('SW registration skipped:', err);
            });
          });
        }
      } catch (err) {}
    </script>
  </head>
  <body style="background-color: #1C261B; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; overflow: hidden;">
    <!-- Pre-React Visual Loading Shell -->
    <div id="v-pre-shell" style="position: fixed; inset: 0; z-index: 99999; background-color: #1C261B; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; color: #FFFFFF; text-align: center; box-sizing: border-box;">
      <div style="position: relative; margin-bottom: 24px;">
        <div style="width: 104px; height: 104px; background-color: #FFFFFF; border-radius: 9999px; display: flex; align-items: center; justify-content: center; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5); border: 4px solid #3E4A35;">
          <img src="/logo-192x192.png" alt="ViaCamper" style="width: 72px; height: 72px; border-radius: 9999px; object-fit: contain;" />
        </div>
      </div>
      
      <h1 style="font-size: 26px; font-weight: 800; margin: 0 0 6px 0; letter-spacing: -0.02em; color: #FFFFFF;">
        ViaCamper App
      </h1>
      <p style="font-size: 11px; font-weight: 700; color: #A8BBA2; margin: 0 0 28px 0; letter-spacing: 0.08em; text-transform: uppercase;">
        Mappe sosta, navigatore sagomato & community
      </p>

      <div style="width: 180px; height: 5px; background: rgba(255, 255, 255, 0.15); border-radius: 9999px; overflow: hidden; position: relative; margin-bottom: 12px;">
        <div style="position: absolute; left: 0; top: 0; bottom: 0; width: 45%; background-color: #A8BBA2; border-radius: 9999px; animation: vc-slide 1.2s infinite ease-in-out;"></div>
      </div>

      <p id="v-status-txt" style="font-size: 11px; color: rgba(255, 255, 255, 0.6); margin: 0; font-weight: 500;">
        Avvio applicazione in corso...
      </p>

      <div id="v-boot-error" style="display: none; margin-top: 20px; max-width: 320px; background-color: rgba(225, 29, 72, 0.15); border: 1px solid rgba(225, 29, 72, 0.3); border-radius: 12px; padding: 12px; font-size: 11px; color: #fda4af;">
        <p id="v-boot-msg" style="margin: 0 0 10px 0; font-family: monospace; word-break: break-word;">Problema durante il caricamento</p>
        <button onclick="window.location.reload()" style="background-color: #3E4A35; color: white; border: 1px solid #5A6B4E; border-radius: 8px; padding: 6px 14px; font-size: 11px; font-weight: bold; cursor: pointer;">
          Ricarica Pagina
        </button>
      </div>
    </div>

    <style>
      @keyframes vc-slide {
        0% { left: -45%; width: 45%; }
        50% { left: 30%; width: 55%; }
        100% { left: 100%; width: 45%; }
      }
    </style>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
